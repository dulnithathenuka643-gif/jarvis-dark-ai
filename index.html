<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS ULTIMATE</title><style>body{margin:0;min-height:100vh;background:#020a14;color:#00eaff;font-family:sans-serif;display:flex;justify-content:center;padding:10px}.box{width:100%;max-width:600px;border:1px solid #00eaff;border-radius:20px;padding:15px;text-align:center;box-shadow:0 0 25px #00eaff55;background:#081a2e}h1{letter-spacing:8px;text-shadow:0 0 15px #00eaff;margin:5px}.sub{font-size:11px;opacity:.7;letter-spacing:3px}.tabs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px 0}.tabs button{font-size:11px;padding:7px 10px;flex:1 1 30%}.active{background:#00eaff!important;color:#001529!important}input,textarea,select{width:96%;padding:10px;border-radius:10px;border:1px solid #00eaff;background:#001529;color:#00eaff;margin:5px;box-sizing:border-box}button{padding:9px 12px;margin:4px;border-radius:10px;border:1px solid #00eaff;background:#002a4a;color:#00eaff;font-weight:bold;cursor:pointer}.panel{display:none;text-align:left}.panel.show{display:block}.chat{max-height:320px;overflow-y:auto;background:#001529;border-radius:10px;padding:10px;margin:8px 0}.msg{margin:6px 0;padding:8px 10px;border-radius:10px;font-size:14px;line-height:1.4}.user{background:#003a6a;text-align:right;margin-left:20px}.ai{background:#0a2a1a;border-left:3px solid #00ff88;margin-right:15px}img.res{width:100%;border-radius:12px;border:1px solid #00eaff;margin-top:10px}.small{font-size:11px;opacity:.6}</style></head><body><div class="box"><h1>JARVIS</h1><div class="sub">ALL IN ONE - ULTIMATE AI</div><p id="st">SYSTEM READY - හැමදේම Ready</p><div class="tabs"><button class="active" onclick="tab(0)">💬 CHAT</button><button onclick="tab(1)">🌐 පරිවර්තනය</button><button onclick="tab(2)">🗣️ කතා</button><button onclick="tab(3)">📸 PHOTO</button><button onclick="tab(4)">📚 පාසල්</button><button onclick="tab(5)">🌍 රටවල්</button></div><div id="p0" class="panel show"><div id="chat0" class="chat"><div class="msg ai">මම ULTIMATE JARVIS! හැමදේම අහන්න!</div></div><textarea id="q0" rows="2" placeholder="මොනද ඕන?"></textarea><button onclick="ask(0)">SEND</button><button onclick="voice('q0',0)">🎤</button></div><div id="p1" class="panel"><select id="lang"><option value="si">Sinhala</option><option value="en">English</option><option value="ta">Tamil</option><option value="hi">Hindi</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="fr">French</option><option value="de">German</option><option value="zh">Chinese</option><option value="ar">Arabic</option></select><textarea id="trIn" rows="3" placeholder="පරිවර්තනය කරන්න ඕන දේ..."></textarea><button onclick="translateNow()">පරිවර්තනය</button><div id="trOut" class="chat" style="min-height:50px"></div><button onclick="speakOut('trOut')">🔊 කියවන්න</button></div><div id="p2" class="panel"><textarea id="spIn" rows="3" placeholder="කතා කරවන්න ඕන දේ..."></textarea><select id="spLang"><option value="si-LK">Sinhala</option><option value="en-US">English US</option><option value="en-GB">English UK</option><option value="ta-IN">Tamil</option><option value="hi-IN">Hindi</option><option value="ja-JP">Japanese</option></select><button onclick="speakNow()">🗣️ කතා කරන්න</button><button onclick="stopSpeak()">⏹️ නවත්තන්න</button></div><div id="p3" class="panel"><textarea id="ph" rows="2" placeholder="ඕන photo එක... ex: Colombo city"></textarea><button onclick="makePhoto()">📸 PHOTO හදන්න</button><div id="phRes"></div></div><div id="p4" class="panel"><div class="small">පාසල් වැඩ, ගණන්, විද්‍යාව, හැමදේම</div><div id="chat4" class="chat"><div class="msg ai">පාසල් වැඩේ මොකක්ද?</div></div><textarea id="q4" rows="2" placeholder="ex: පයිතගරස් ප්‍රමේයය..."></textarea><button onclick="ask(4)">උදව් ගන්න</button></div><div id="p5" class="panel"><input id="cIn" placeholder="රටක නම... ex: Japan"><button onclick="countryInfo()">🌍 විස්තර</button><div id="cRes" class="chat" style="min-height:60px"></div></div></div><script>function tab(n){document.querySelectorAll('.panel').forEach((e,i)=>e.classList.toggle('show',i==n));document.querySelectorAll('.tabs button').forEach((e,i)=>e.classList.toggle('active',i==n));document.getElementById('st').innerText=['CHAT','TRANSLATE','SPEAK','PHOTO','SCHOOL','COUNTRY'][n];}async function ask(t){let id=t==0?'q0':'q4',chat=t==0?'chat0':'chat4',q=document.getElementById(id).value;if(!q)return;let b=document.getElementById(chat);b.innerHTML+='<div class="msg user">'+q+'</div>';document.getElementById(id).value='';document.getElementById('st').innerText='THINKING...';b.scrollTop=b.scrollHeight;try{let p=t==4?'You are best teacher explain in Sinhala. Q: ':'You are ULTIMATE JARVIS help in Sinhala mix English. Q: ';let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(p+q)),a=await r.text();b.innerHTML+='<div class="msg ai">'+a+'<br><button onclick="speakText(this)">🔊</button></div>';}catch(e){b.innerHTML+='<div class="msg ai">Error</div>';}document.getElementById('st').innerText='READY';b.scrollTop=9999;}async function translateNow(){let t=document.getElementById('trIn').value,to=document.getElementById('lang').value;if(!t)return;document.getElementById('st').innerText='TRANSLATING...';let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent('Translate to '+to+': '+t)),a=await r.text();document.getElementById('trOut').innerHTML='<div class="msg ai">'+a+'</div>';document.getElementById('st').innerText='READY';}function speakNow(){let t=document.getElementById('spIn').value,l=document.getElementById('spLang').value;if(!t)return;let u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=0.9;speechSynthesis.speak(u);document.getElementById('st').innerText='SPEAKING...';u.onend=()=>document.getElementById('st').innerText='READY';}function speakOut(i){let t=document.getElementById(i).innerText;if(!t)return;let u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u);}function speakText(b){let t=b.parentElement.innerText.replace('🔊','');let u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u);}function stopSpeak(){speechSynthesis.cancel();document.getElementById('st').innerText='READY';}function makePhoto(){let p=document.getElementById('ph').value;if(!p)return alert('Photo එක type කරන්න!');document.getElementById('st').innerText='CREATING...';let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p+', 8k ultra detailed')+'?nologo=true&random='+Date.now();document.getElementById('phRes').innerHTML='<p>'+p+'</p><img class=res src="'+url+'" onload="document.getElementById(\'st\').innerText=\'READY\'"><br><a href="'+url+'" target=_blank><button>DOWNLOAD</button></a>';}async function countryInfo(){let c=document.getElementById('cIn').value;if(!c)return;document.getElementById('st').innerText='SEARCHING...';try{let r=await fetch('https://restcountries.com/v3.1/name/'+c),d=await r.json(),x=d[0],info='<b>'+x.name.common+' '+x.flag+'</b><br>අගනුවර: '+x.capital+'<br>ජනගහනය: '+x.population.toLocaleString()+'<br>ප්‍රදේශය: '+x.area+' km²<br>මහද්වීපය: '+x.continents+'<br>මුදල්: '+Object.values(x.currencies||{}).map(v=>v.name).join(', ');document.getElementById('cRes').innerHTML='<div class=msg ai>'+info+'</div>';let r2=await fetch('https://text.pollinations.ai/'+encodeURIComponent('Give 5 facts about '+c+' in Sinhala short')),f=await r2.text();document.getElementById('cRes').innerHTML+='<div class="msg ai">🌟 '+f+'</div>';}catch(e){document.getElementById('cRes').innerHTML='<div class=msg ai>රට හොයාගන්න බැරිවුණා</div>';}document.getElementById('st').innerText='READY';}function voice(id,ct){let R=new(window.SpeechRecognition||window.webkitSpeechRecognition)();R.lang='en-US';R.onstart=()=>document.getElementById('st').innerText='LISTENING...';R.onresult=e=>{document.getElementById(id).value=e.results[0][0].transcript;if(ct!==null)ask(ct);};R.start();}</script></body></html>
