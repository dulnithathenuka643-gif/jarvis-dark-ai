<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Photo AI</title>
<style>
body{margin:0;min-height:100vh;background:#020a14;color:#00eaff;font-family:sans-serif;display:flex;justify-content:center;align-items:center}
.box{width:95%;max-width:520px;border:1px solid #00eaff;border-radius:20px;padding:20px;text-align:center;box-shadow:0 0 20px #00eaff55;background:#081a2e}
h1{letter-spacing:5px;text-shadow:0 0 10px #00eaff}
.circle{width:120px;height:120px;margin:15px auto;border:2px solid #00eaff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px #00eaff}
input{width:95%;padding:12px;border-radius:10px;border:1px solid #00eaff;background:#001529;color:#00eaff;margin:5px}
button{padding:10px 15px;margin:5px;border-radius:10px;border:1px solid #00eaff;background:#002a4a;color:#00eaff;font-weight:bold}
img{width:100%;margin-top:15px;border-radius:15px;border:1px solid #00eaff}
</style>
</head>
<body>
<div class="box">
<h1>JARVIS</h1>
<p>PHOTO CREATOR AI</p>
<div class="circle">●</div>
<p id="st">SYSTEM READY</p>
<input id="p" placeholder="ඔයාට ඕන photo එක type කරන්න...">
<br>
<button onclick="make()">PHOTO හදන්න</button>
<button onclick="voice()">කතා කරලා හදන්න</button>
<div id="res"></div>
</div>
<script>
function make(){
let prompt=document.getElementById('p').value;
if(!prompt){alert('මුලින්ම photo එකක් type කරන්න!');return;}
document.getElementById('st').innerText='CREATING PHOTO...';
let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt+', 8k, ultra detailed')+'?nologo=true&random='+Date.now();
document.getElementById('res').innerHTML='<p>Prompt: '+prompt+'</p><img src="'+url+'" onload="document.getElementById(\'st\').innerText=\'PHOTO READY\'"><br><br><a href="'+url+'" target="_blank"><button>DOWNLOAD</button></a>';
}
function voice(){
let r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
r.lang='en-US'; r.onstart=()=>document.getElementById('st').innerText='LISTENING...';
r.onresult=e=>{document.getElementById('p').value=e.results[0][0].transcript; make();};
r.start();
}
</script>
</body>
</html>
