<!DOCTYPE html><html lang="si"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JARVIS GOD MODE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(#0a2a4a,#020a14);color:#00eaff;font-family:system-ui;display:flex;justify-content:center;padding:8px}.box{width:100%;max-width:720px;border:2px solid #00eaff;border-radius:22px;padding:12px;background:rgba(8,26,46,.97);box-shadow:0 0 35px #00eaff66}h1{text-align:center;letter-spacing:8px;text-shadow:0 0 15px #00eaff;margin:5px}.sub{text-align:center;font-size:9px;opacity:.7;letter-spacing:2px;margin-bottom:8px}.tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0}.tabs button{flex:1 1 23%;font-size:9px;padding:8px 2px;border-radius:10px;border:1px solid #00eaff;background:#001a33;color:#00eaff;font-weight:bold}.tabs button.active{background:#00eaff;color:#001529}.panel{display:none}.panel.show{display:block}input,textarea,select{width:100%;padding:10px;border-radius:11px;border:1px solid #00eaff;background:#001529;color:#00eaff;margin:5px 0;font-size:13px}button.act{padding:8px 10px;margin:3px;border-radius:10px;border:1px solid #00eaff;background:#002a4a;color:#00eaff;font-weight:bold;cursor:pointer;font-size:12px}.chat{max-height:300px;overflow-y:auto;background:#001120;border-radius:11px;padding:8px;margin:6px 0;border:1px solid #00eaff33}.msg{margin:5px 0;padding:7px 10px;border-radius:10px;font-size:13px}.user{background:#003a6a;text-align:right;margin-left:10px}.ai{background:#0a2a1a;border-left:3px solid #00ff88}.res{width:100%;border-radius:12px;border:1px solid #00eaff;margin-top:8px}.upBox{border:2px dashed #00eaff;border-radius:14px;padding:10px;text-align:center;background:#001529;margin:6px 0}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}</style></head><body><div class="box"><h1>JARVIS GOD</h1><div class="sub">EVERYTHING YOU CAN DO - ALL IN ONE</div><div class="tabs"><button class="active" onclick="tab(0)">💬 CHAT</button><button onclick="tab(1)">🔍 SEARCH</button><button onclick="tab(2)">🌐 LANG 38</button><button onclick="tab(3)">🗣️ VOICE</button><button onclick="tab(4)">📸 PHOTO</button><button onclick="tab(5)">👤 FACE</button><button onclick="tab(6)">📚 SCHOOL</button><button onclick="tab(7)">🌍 COUNTRY</button><button onclick="tab(8)">🔢 CALC</button><button onclick="tab(9)">🌤️ WEATHER</button><button onclick="tab(10)">📱 QR</button><button onclick="tab(11)">🛠️ TOOLS</button></div>

<div id="p0" class="panel show"><div id="chat0" class="chat"><div class="msg ai">GOD MODE ON! මොනද ඕන බං? ඕන දෙයක් කරන්න පුළුවන්!</div></div><textarea id="q0" rows="2" placeholder="ඕන දෙයක් අහන්න..."></textarea><div class="grid"><button class="act" onclick="ask(0)">🚀 SEND</button><button class="act" onclick="clearChat('chat0')">🗑️ Clear</button></div></div>
<div id="p1" class="panel"><input id="sIn" placeholder="මොනද හොයන්නේ? ex: Sri Lanka news"><button class="act" onclick="searchAll()">🔍 හොයන්න</button><div id="sRes" class="chat"></div></div>
<div id="p2" class="panel"><select id="lang"><option value="si">🇱🇰 Sinhala</option><option value="en">🇺🇸 English</option><option value="ta">🇱🇰 Tamil</option><option value="hi">🇮🇳 Hindi</option><option value="ur">🇵🇰 Urdu</option><option value="ja">🇯🇵 Japanese</option><option value="ko">🇰🇷 Korean</option><option value="zh">🇨🇳 Chinese</option><option value="fr">🇫🇷 French</option><option value="de">🇩🇪 German</option><option value="es">🇪🇸 Spanish</option><option value="it">🇮🇹 Italian</option><option value="pt">🇵🇹 Portuguese</option><option value="ru">🇷🇺 Russian</option><option value="ar">🇸🇦 Arabic</option><option value="nl">🇳🇱 Dutch</option><option value="tr">🇹🇷 Turkish</option><option value="pl">🇵🇱 Polish</option><option value="id">🇮🇩 Indonesian</option><option value="ms">🇲🇾 Malay</option><option value="th">🇹🇭 Thai</option><option value="vi">🇻🇳 Vietnamese</option><option value="bn">🇧🇩 Bengali</option><option value="ml">🇮🇳 Malayalam</option><option value="te">🇮🇳 Telugu</option><option value="ne">🇳🇵 Nepali</option><option value="fil">🇵🇭 Filipino</option><option value="el">🇬🇷 Greek</option><option value="sv">🇸🇪 Swedish</option><option value="ro">🇷🇴 Romanian</option><option value="uk">🇺🇦 Ukrainian</option></select><textarea id="trIn" rows="2" placeholder="Translate කරන්න..."></textarea><button class="act" onclick="trans()">🌐 Translate</button><div id="trOut" class="chat"></div></div>
<div id="p3" class="panel"><textarea id="spIn" rows="2" placeholder="කතා කරවන්න..."></textarea><button class="act" onclick="speakNow()">🗣️ කතා කරන්න</button><button class="act" onclick="stopSpeak()">⏹️ නවත්තන්න</button></div>
<div id="p4" class="panel"><textarea id="ph" rows="2" placeholder="Photo එක..."></textarea><button class="act" onclick="makePhoto()">📸 හදන්න</button><div id="phRes"></div></div>
<div id="p5" class="panel"><div class="upBox"><input type="file" id="file" accept="image/*" onchange="preview(event)"><p>👇 ඔයාගේ Photo එක දාන්න</p><img id="myFace" class="res" style="display:none;max-height:200px"></div><div class="grid"><button class="act" onclick="genFace('Iron Man suit')">🦾 Iron Man</button><button class="act" onclick="genFace('Army')">🪖 Army</button><button class="act" onclick="genFace('Superman')">🦸 Superman</button><button class="act" onclick="genFace('CEO suit')">💼 Suit</button><button class="act" onclick="genFace('cartoon')">🎨 Cartoon</button></div><textarea id="customFace" rows="1" placeholder="වෙන..."></textarea><button class="act" onclick="genCustomFace()">🤖 හදන්න</button><div id="faceRes"></div></div>
<div id="p6" class="panel"><div id="chat6" class="chat"><div class="msg ai">පාසල් වැඩේ?</div></div><textarea id="q6" rows="2"></textarea><button class="act" onclick="ask(6)">📚 අහන්න</button></div>
<div id="p7" class="panel"><input id="cIn" placeholder="රට..."><button class="act" onclick="countryInfo()">🌍 ගන්න</button><div id="cRes" class="chat"></div></div>
<div id="p8" class="panel"><p>🔢 Calculator - සේරම ගණන්</p><input id="calc" placeholder="ex: 500*12/100"><button class="act" onclick="doCalc()">= ගණන් හදන්න</button><div id="calcRes" class="chat"></div><div class="grid"><button class="act" onclick="addCalc('500*0.12')">12% ගණන්</button><button class="act" onclick="addCalc('1000/30')">දවසට කීයද</button></div></div>
<div id="p9" class="panel"><p>🌤️ Weather - කාලගුණය</p><input id="wIn" placeholder="නගරය... ex: Colombo"><button class="act" onclick="weather()">🌤️ බලන්න</button><div id="wRes" class="chat"></div></div>
<div id="p10" class="panel"><p>📱 QR Code හදන්න</p><input id="qrIn" placeholder="Text / Link... ex: https://..."><button class="act" onclick="makeQR()">📱 QR හදන්න</button><div id="qrRes"></div></div>
<div id="p11" class="panel"><p>🛠️ Tools - වෙන සේරම</p><div class="grid"><button class="act" onclick="tool('time')">🕒 වෙලාව</button><button class="act" onclick="tool('random')">🎲 Random Number</button><button class="act" onclick="tool('color')">🎨 Random Color</button><button class="act" onclick="tool('pass')">🔑 Password හදන්න</button></div><div id="toolRes" class="chat"></div></div>

</div><script>
function tab(n){document.querySelectorAll('.panel').forEach((e,i)=>e.classList.toggle('show',i==n));document.querySelectorAll('.tabs button').forEach((e,i)=>e.classList.toggle('active',i==n));}
function addMsg(id,cls,t){let b=document.getElementById(id);b.innerHTML+='<div class="msg '+cls+'">'+t+'</div>';b.scrollTop=9999;}
async function ask(t){let qid=t==0?'q0':'q6',cid=t==0?'chat0':'chat6',q=document.getElementById(qid).value.trim();if(!q)return;addMsg(cid,'user',q);document.getElementById(qid).value='';try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q)),a=await r.text();addMsg(cid,'ai',a);}catch(e){addMsg(cid,'ai','Error');}}
async function searchAll(){let q=document.getElementById('sIn').value.trim();if(!q)return;let b=document.getElementById('sRes');b.innerHTML='⏳';try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent('Search: '+q)),a=await r.text();b.innerHTML='<div class=msg ai>'+a+'</div>';}catch(e){b.innerHTML='Error';}}
async function trans(){let t=document.getElementById('trIn').value,to=document.getElementById('lang').value;if(!t)return;let b=document.getElementById('trOut');b.innerHTML='⏳';try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent('Translate to '+to+': '+t)),a=await r.text();b.innerHTML='<div class=msg ai>'+a+'</div>';}catch(e){b.innerHTML='Error';}}
function speakNow(){let t=document.getElementById('spIn').value;let u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u);}function stopSpeak(){speechSynthesis.cancel();}
function makePhoto(){let p=document.getElementById('ph').value.trim();if(!p)return;let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?nologo=true&random='+Date.now();document.getElementById('phRes').innerHTML='<img class=res src="'+url+'"><br><a href="'+url+'" target=_blank><button class=act>💾 DOWNLOAD</button></a>';}
let faceData="";function preview(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){faceData=ev.target.result;let img=document.getElementById('myFace');img.src=faceData;img.style.display='block';};r.readAsDataURL(f);}
function genFace(s){if(!faceData)return alert('Photo දාන්න!');let url='https://image.pollinations.ai/prompt/'+encodeURIComponent('person wearing '+s+', ultra realistic')+'?nologo=true&random='+Date.now();document.getElementById('faceRes').innerHTML='<img class=res src="'+url+'"><br><a href="'+url+'" target=_blank><button class=act>💾 DOWNLOAD</button></a>';}
function genCustomFace(){let c=document.getElementById('customFace').value.trim();if(!c)return;genFace(c);}
async function countryInfo(){let c=document.getElementById('cIn').value.trim();if(!c)return;try{let r=await fetch('https://restcountries.com/v3.1/name/'+c),d=await r.json(),x=d[0];document.getElementById('cRes').innerHTML='<div class=msg ai>'+x.name.common+' '+x.flag+'<br>'+x.capital+'<br><img class=res src="'+x.flags.png+'"></div>';}catch(e){document.getElementById('cRes').innerHTML='Not found';}}
function doCalc(){let e=document.getElementById('calc').value;try{let r=eval(e);document.getElementById('calcRes').innerHTML='<div class=msg ai>'+e+' = <b>'+r+'</b></div>';}catch{ document.getElementById('calcRes').innerHTML='Error';}}function addCalc(v){document.getElementById('calc').value=v;doCalc();}
async function weather(){let c=document.getElementById('wIn').value.trim()||'Colombo';let b=document.getElementById('wRes');b.innerHTML='⏳';try{let r=await fetch('https://wttr.in/'+c+'?format=j1');let d=await r.json();let cur=d.current_condition[0];b.innerHTML='<div class=msg ai>📍 '+c+'<br>🌡️ '+cur.temp_C+'°C<br>☁️ '+cur.weatherDesc[0].value+'<br>💨 '+cur.windspeedKmph+' km/h<br>💧 Humidity: '+cur.humidity+'%</div>';}catch(e){try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent('weather in '+c)),a=await r.text();b.innerHTML='<div class=msg ai>'+a+'</div>';}catch{ b.innerHTML='Error';}}}
function makeQR(){let t=document.getElementById('qrIn').value.trim();if(!t)return;let url='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(t);document.getElementById('qrRes').innerHTML='<img class=res src="'+url+'"><br><a href="'+url+'" target=_blank><button class=act>💾 DOWNLOAD QR</button></a>';}
function tool(type){let b=document.getElementById('toolRes');if(type=='time'){b.innerHTML='<div class=msg ai>🕒 දැන් වෙලාව: '+new Date().toLocaleString()+'</div>';}else if(type=='random'){b.innerHTML='<div class=msg ai>🎲 Random: '+(Math.floor(Math.random()*100)+1)+'</div>';}else if(type=='color'){let c='#'+Math.floor(Math.random()*16777215).toString(16);b.innerHTML='<div class=msg ai style=background:'+c+';color:#fff>🎨 Color: '+c+'</div>';}else if(type=='pass'){let p=Math.random().toString(36).slice(-10)+'!A1';b.innerHTML='<div class=msg ai>🔑 Password: <b>'+p+'</b></div>';}}
function clearChat(id){document.getElementById(id).innerHTML='';}
</script></body></html>
